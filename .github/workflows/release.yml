name: Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'

# gh release create needs contents: write; the default GITHUB_TOKEN
# permission is read-only, so this must be explicit.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Test, package, publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        # Reads the pinned version from packageManager: pnpm@10.14.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      # ── Resolve what we're releasing ────────────────────────────────────
      # Tag push v*         → stable release; tag must match package.json version.
      # Push to main via PR → rolling release "<version>-<PR number>" (e.g. v0.2.2-123),
      #                       marked prerelease so stable tags keep the "latest" pointer.
      # Direct push to main → tests only; no release is created.
      - name: Resolve release metadata
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          BASE_VERSION="$(node -p "require('./package.json').version")"

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            if [ "v${BASE_VERSION}" != "${GITHUB_REF_NAME}" ]; then
              echo "::error::Tag '${GITHUB_REF_NAME}' does not match package.json version '${BASE_VERSION}' (expected 'v${BASE_VERSION}')."
              echo "::error::Bump package.json version (and CHANGELOG.md), commit, then delete and re-push the tag:"
              echo "::error::  git tag -d ${GITHUB_REF_NAME} && git push origin :refs/tags/${GITHUB_REF_NAME}"
              exit 1
            fi
            VERSION="${BASE_VERSION}"
            TAG="${GITHUB_REF_NAME}"
            if [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+- ]]; then PRERELEASE=true; else PRERELEASE=false; fi
          else
            # Push to main: find the PR behind this merge commit.
            PR_NUMBER="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '.[0].number' 2>/dev/null || true)"
            if [ -z "${PR_NUMBER}" ]; then
              # Fallback: parse the merge-commit subject ("Merge pull request #N from ...").
              PR_NUMBER="$(printf '%s' "${HEAD_COMMIT_MESSAGE}" | sed -n 's/^Merge pull request #\([0-9][0-9]*\) from .*/\1/p' | head -n1)"
            fi
            if [ -z "${PR_NUMBER}" ]; then
              echo "No PR associated with ${GITHUB_SHA}; ran validation only, skipping release."
              echo "version=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            VERSION="${BASE_VERSION}-${PR_NUMBER}"
            TAG="v${VERSION}"
            PRERELEASE=true
            echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "Merging PR #${PR_NUMBER} → rolling release ${TAG}"
            # Patch the ephemeral checkout so the vsix carries the PR-suffixed version.
            node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=process.argv[1];fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');" "${VERSION}"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Package
        if: steps.meta.outputs.version != ''
        run: pnpm run package

      - name: Verify vsix exists
        if: steps.meta.outputs.version != ''
        run: |
          VSIX="openspec-workflow-${{ steps.meta.outputs.version }}.vsix"
          if [ ! -f "$VSIX" ]; then
            echo "::error::Expected ${VSIX} in the repository root after packaging:"
            ls -l ./*.vsix 2>/dev/null || echo "(no .vsix files found)"
            exit 1
          fi
          echo "VSIX_PATH=$VSIX" >> "$GITHUB_ENV"

      - name: Extract release notes from CHANGELOG.md
        if: steps.meta.outputs.version != '' && startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          # Literal index() match, not regex: no escaping pitfalls for dots,
          # and "[0.2.2]" cannot prefix-match "[0.2.20]".
          awk -v ver="[${VERSION}]" '
            index($0, "## " ver) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "::warning::No CHANGELOG.md section found for ${VERSION}; using fallback notes."
            printf 'See the [CHANGELOG](https://github.com/MotusLabs/openspec-ext/blob/main/CHANGELOG.md) for details.\n' > release_notes.md
          fi
          echo '--- Extracted release notes ---'
          cat release_notes.md

      - name: Build release notes from PR
        if: steps.meta.outputs.version != '' && !startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr view --repo "${GITHUB_REPOSITORY}" "${{ steps.meta.outputs.pr_number }}" \
            --json title,body,url \
            --jq '"## " + .title + "\n\n" + .body + "\n\n---\nPull request: " + .url' > release_notes.md
          echo '--- Release notes ---'
          cat release_notes.md

      - name: Create GitHub Release and attach vsix
        if: steps.meta.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS=""
          if [ "${{ steps.meta.outputs.prerelease }}" = "true" ]; then
            FLAGS="--prerelease"
          fi
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            gh release create "${{ steps.meta.outputs.tag }}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "OpenSpec (MotusLab) ${{ steps.meta.outputs.tag }}" \
              --notes-file release_notes.md \
              --verify-tag \
              $FLAGS \
              "${VSIX_PATH}"
          else
            gh release create "${{ steps.meta.outputs.tag }}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "OpenSpec (MotusLab) ${{ steps.meta.outputs.tag }} (PR #${{ steps.meta.outputs.pr_number }})" \
              --notes-file release_notes.md \
              $FLAGS \
              "${VSIX_PATH}"
          fi

      - name: Job summary
        if: steps.meta.outputs.version != ''
        run: |
          echo "Release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${{ steps.meta.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact: ${VSIX_PATH}" >> "$GITHUB_STEP_SUMMARY"
